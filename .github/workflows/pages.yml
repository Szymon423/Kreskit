# Builds the landing page and the browser version of the app, and publishes them to GitHub Pages.
# If a run fails, start a new one with "Run workflow"; "Re-run jobs" uploads a second artifact
# under the same name and the deploy step then refuses to pick one.
name: Deploy website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish, and queue at most one more behind it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:web
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist-web
      - id: deployment
        uses: actions/deploy-pages@v5
